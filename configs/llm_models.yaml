# LLM sweep configuration (`osb llm-sweep`).
#
# Every endpoint is OpenAI-compatible: OpenRouter for commercial frontier
# models, vLLM for open-weight models served on Killarney
# (see slurm/serve_vllm.sbatch). API keys are read from the environment.

budget_usd: 500.0          # Hard cap across the whole sweep (reserved upfront).
max_concurrency: 16
timeout_seconds: 300
max_retries: 6
benchmark: open_sr_bench
tier: 20
stability: true            # Seed-1 repeat on the 10% stability subset.

endpoints:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
  vllm_local:
    base_url: ${VLLM_BASE_URL:-http://localhost:8000/v1}
    api_key_env: VLLM_API_KEY

conditions:
  condition_a: {template: configs/prompts/condition_a.txt, parser: tag,
                max_tokens: 256}
  condition_b: {template: configs/prompts/condition_b.txt, parser: tag,
                max_tokens: 4096}
  cao2025: {template: configs/prompts/cao2025.txt, parser: cao,
            max_tokens: 1024}

models:
  # Open-weight verifier for the two-stage cascade (local, free).
  gpt-oss-20b:
    enabled: true
    endpoint: vllm_local
    model: openai/gpt-oss-20b
    price_per_mtok: {input: 0.0, output: 0.0}
    conditions:
      # gpt-oss always reasons; "low" is its lowest effort (protocol 4).
      condition_a: {extra_body: {reasoning_effort: low}}
      condition_b: {extra_body: {reasoning_effort: low}}

  # Commercial frontier models via OpenRouter. Verify slugs and prices on
  # https://openrouter.ai/models before enabling; set OPENROUTER_API_KEY.
  frontier-model-1:
    enabled: false
    endpoint: openrouter
    model: openai/gpt-5
    price_per_mtok: {input: 1.25, output: 10.0}
    conditions:
      condition_a: {extra_body: {reasoning: {effort: minimal}}}
      condition_b: {extra_body: {reasoning: {effort: low}}}
      cao2025: {extra_body: {reasoning: {effort: minimal}}}
  frontier-model-2:
    enabled: false
    endpoint: openrouter
    model: google/gemini-2.5-pro
    price_per_mtok: {input: 1.25, output: 10.0}
    conditions:
      condition_a: {extra_body: {reasoning: {max_tokens: 128}}}
      condition_b: {extra_body: {reasoning: {max_tokens: 4096}}}
